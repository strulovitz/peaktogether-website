        .social-icon img {

        .social-label {

        /* Desktop / mouse: pretty tooltip bubble on hover or keyboard focus */
        @media (hover: hover) {
            .social-icon::after {
                content: attr(data-tooltip);
                position: absolute;
                bottom: calc(100% + 10px);
                left: 50%;
                transform: translateX(-50%) translateY(4px);
                background: #234E70;
                color: #fff;
                padding: 6px 11px;

                opacity: 0;
                pointer-events: none;
                transition: opacity 0.18s ease, transform 0.18s ease;
                z-index: 20;
            }
            .social-icon::before {
                content: '';
                position: absolute;
                bottom: calc(100% + 4px);
                left: 50%;
                transform: translateX(-50%) translateY(4px);
                border: 6px solid transparent;
                border-top-color: #234E70;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.18s ease, transform 0.18s ease;
                z-index: 20;
            }
            .social-icon:hover::after,
            .social-icon:focus-visible::after,
            .social-icon:hover::before,
            .social-icon:focus-visible::before {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* Touch / smartphones (no hover): show a label under every icon */
        @media (hover: none) {
            .social-label {
                display: block;
            }
            .footer-social {
